<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Osvezavanje FGR aplikacije</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #141009;
        color: #f4ead7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(440px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid rgba(225, 178, 75, 0.35);
        border-radius: 10px;
        background: #21190f;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0; color: #c8b99d; line-height: 1.5; }
      a { color: #e1b24b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Osvezavam FGR...</h1>
      <p>Brisem stari cache, repertoar i lokalne snimke, pa otvaram cistu aplikaciju.</p>
    </main>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          // Clearing the cache alone leaves the repertoire behind, which is
          // where a half-written song record lives — the one that shows an
          // empty chart because its analysis no longer exists. A reset that
          // does not remove it is not a reset.
          for (const key of Object.keys(localStorage)) {
            if (key.startsWith("pwa-klavir") || key.startsWith("fgr-")) localStorage.removeItem(key);
          }

          if (window.indexedDB?.databases) {
            const databases = await indexedDB.databases();
            await Promise.all(
              databases
                .map((database) => database?.name)
                .filter(Boolean)
                .map((name) => new Promise((resolve) => {
                  const request = indexedDB.deleteDatabase(name);
                  request.onsuccess = request.onerror = request.onblocked = () => resolve();
                }))
            );
          }
        } catch (error) {
          console.warn("Reset nije kompletno uspeo", error);
        }

        location.replace("./?cache-reset=" + Date.now());
      })();
    </script>
  </body>
</html>
